<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Absensi Satria Muda</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 p-4">

  <!-- HALAMAN UTAMA (MURID) -->
  <div id="page-student" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden mt-4 transition-all duration-300">
    <div class="bg-slate-900 p-6 text-white text-center relative">
      <i data-lucide="shield" class="w-12 h-12 mx-auto text-red-500 mb-2"></i>
      <h1 class="text-xl font-bold tracking-wider">SATRIA MUDA INDONESIA</h1>
      <p class="text-xs text-slate-300 mt-1">Portal Absensi & Pendaftaran Atlet</p>
      <button onclick="toggleAdmin()" class="absolute top-4 right-4 text-slate-500 hover:text-white">
        <i data-lucide="lock" class="w-5 h-5"></i>
      </button>
    </div>
    
    <div class="p-6">
      <div id="alert-success" class="hidden mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm font-bold text-center">
        Data berhasil dikirim! Selamat berlatih.
      </div>

      <form id="form-absen" class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Nama Lengkap</label>
          <input type="text" id="input-nama" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none" placeholder="Masukkan nama kamu...">
        </div>
        
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Status Kehadiran</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="status" value="Hadir" checked class="peer sr-only" onchange="toggleAlasan()">
              <div class="text-center py-2 bg-slate-100 border border-slate-200 rounded-lg peer-checked:bg-red-600 peer-checked:text-white peer-checked:font-bold transition-all text-sm">Hadir</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="status" value="Izin" class="peer sr-only" onchange="toggleAlasan()">
              <div class="text-center py-2 bg-slate-100 border border-slate-200 rounded-lg peer-checked:bg-yellow-500 peer-checked:text-white peer-checked:font-bold transition-all text-sm">Izin</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="status" value="Sakit" class="peer sr-only" onchange="toggleAlasan()">
              <div class="text-center py-2 bg-slate-100 border border-slate-200 rounded-lg peer-checked:bg-blue-500 peer-checked:text-white peer-checked:font-bold transition-all text-sm">Sakit</div>
            </label>
          </div>
        </div>

        <div id="wrap-alasan" class="hidden">
          <label class="block text-sm font-bold text-slate-700 mb-1">Alasan (Wajib diisi jika Izin/Sakit)</label>
          <input type="text" id="input-alasan" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none" placeholder="Kenapa tidak hadir?">
        </div>

        <button type="submit" id="btn-submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 mt-4 shadow-md transition-all">
          <i data-lucide="clipboard-check" class="w-5 h-5"></i> Kirim Absensi
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-slate-200 text-center">
        <p class="text-xs font-bold text-slate-500 mb-3">BELUM GABUNG EKSKUL?</p>
        <button class="w-full bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all">
          <i data-lucide="user-plus" class="w-5 h-5"></i> Daftar Silat Sekarang
        </button>
      </div>
    </div>
  </div>

  <!-- HALAMAN LOGIN ADMIN -->
  <div id="page-login" class="hidden max-w-sm mx-auto mt-20 bg-white p-6 rounded-2xl shadow-xl">
    <div class="text-center mb-6">
      <i data-lucide="lock" class="w-10 h-10 mx-auto text-slate-800 mb-2"></i>
      <h2 class="text-lg font-bold">Akses Pengurus</h2>
    </div>
    <input type="password" id="input-pin" class="w-full p-3 border rounded-xl mb-4 text-center text-xl tracking-[0.5em]" placeholder="PIN">
    <button onclick="loginAdmin()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold mb-2">Masuk</button>
    <button onclick="toggleAdmin()" class="w-full bg-slate-100 text-slate-600 py-3 rounded-xl font-bold">Batal</button>
  </div>

  <!-- HALAMAN DASHBOARD ADMIN (REKAP) -->
  <div id="page-admin" class="hidden max-w-4xl mx-auto mt-4">
    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <div>
        <h2 class="font-bold text-lg flex items-center gap-2"><i data-lucide="database" class="text-red-500"></i> Dashboard Rekap</h2>
        <p class="text-xs text-slate-500">Live Database Terkoneksi</p>
      </div>
      <button onclick="logoutAdmin()" class="text-slate-500 hover:text-red-600 font-bold flex items-center gap-1 text-sm bg-slate-100 px-3 py-2 rounded-lg">
        <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
      </button>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
        <h3 class="font-bold text-slate-700">Data Kehadiran Minggu Ini</h3>
        <button onclick="exportExcel()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2 text-sm transition-all shadow-sm">
          <i data-lucide="download" class="w-4 h-4"></i> Export Excel
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-100 text-slate-700 uppercase text-xs font-bold">
            <tr>
              <th class="px-4 py-3">Tanggal & Waktu</th>
              <th class="px-4 py-3">Nama Lengkap</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3">Alasan</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100">
            <!-- Data dari Firebase akan muncul di sini -->
            <tr><td colspan="4" class="text-center py-6">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- FIREBASE & LOGIC SCRIPT -->
  <script type="module">
    // Import SDK Firebase v10
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Konfigurasi Firebase lo
    const firebaseConfig = {
      apiKey: "AIzaSyCgg0-KSNRxMjMaMSZbDG1WMtZLwCkVJjY",
      authDomain: "absen-silat-hidayah.firebaseapp.com",
      projectId: "absen-silat-hidayah",
      storageBucket: "absen-silat-hidayah.firebasestorage.app",
      messagingSenderId: "407664096960",
      appId: "1:407664096960:web:0fe17e00d9177491cb1f25"
    };

    // Inisialisasi Aplikasi & Database
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let absensiData = []; // Buat nyimpen data untuk export excel

    // 1. FUNGSI KIRIM ABSEN
    document.getElementById('form-absen').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const nama = document.getElementById('input-nama').value;
      const status = document.querySelector('input[name="status"]:checked').value;
      const alasan = document.getElementById('input-alasan').value;

      if(status !== 'Hadir' && alasan.trim() === '') {
        alert('Harap isi alasan jika Izin atau Sakit!');
        return;
      }

      btn.innerHTML = 'Mengirim...';
      btn.disabled = true;

      try {
        await addDoc(collection(db, "absensi"), {
          nama: nama,
          status: status,
          alasan: status === 'Hadir' ? '-' : alasan,
          waktu: serverTimestamp()
        });
        
        document.getElementById('form-absen').reset();
        document.getElementById('alert-success').classList.remove('hidden');
        setTimeout(() => document.getElementById('alert-success').classList.add('hidden'), 3000);
      } catch (e) {
        console.error(e);
        alert('Gagal mengirim data. Coba lagi.');
      } finally {
        btn.innerHTML = '<i data-lucide="clipboard-check" class="w-5 h-5"></i> Kirim Absensi';
        btn.disabled = false;
        lucide.createIcons();
      }
    });

    // 2. FUNGSI TARIK DATA REALTIME (Untuk Dashboard Admin)
    const q = query(collection(db, "absensi"), orderBy("waktu", "desc"));
    onSnapshot(q, (querySnapshot) => {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      absensiData = []; // Reset data export

      if(querySnapshot.empty) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6">Belum ada data absensi.</td></tr>';
        return;
      }

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        let waktuStr = '-';
        if(data.waktu) {
          const date = data.waktu.toDate();
          waktuStr = date.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
        }
        
        // Simpan ke array untuk Excel
        absensiData.push({ Waktu: waktuStr, Nama: data.nama, Status: data.status, Alasan: data.alasan });

        // Bikin warna badge status
        let statusWarna = data.status === 'Hadir' ? 'bg-green-100 text-green-700' : (data.status === 'Izin' ? 'bg-yellow-100 text-yellow-700' : 'bg-blue-100 text-blue-700');

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-4 py-3">${waktuStr}</td>
            <td class="px-4 py-3 font-bold text-slate-800">${data.nama}</td>
            <td class="px-4 py-3"><span class="px-2 py-1 rounded text-xs font-bold ${statusWarna}">${data.status}</span></td>
            <td class="px-4 py-3 text-xs">${data.alasan}</td>
          </tr>
        `;
      });
    });

    // 3. FUNGSI EXPORT EXCEL (CSV)
    window.exportExcel = () => {
      if(absensiData.length === 0) return alert('Tidak ada data untuk diexport!');
      
      let csvContent = "data:text/csv;charset=utf-8,Tanggal Waktu,Nama,Status,Alasan\n";
      absensiData.forEach(row => {
        csvContent += `"${row.Waktu}","${row.Nama}","${row.Status}","${row.Alasan}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Rekap_Absen_Silat_${new Date().toLocaleDateString('id-ID')}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    lucide.createIcons();
  </script>

  <!-- UI LOGIC (TABS & LOGIN) -->
  <script>
    function toggleAlasan() {
      const status = document.querySelector('input[name="status"]:checked').value;
      const wrap = document.getElementById('wrap-alasan');
      if(status === 'Hadir') wrap.classList.add('hidden');
      else wrap.classList.remove('hidden');
    }

    function toggleAdmin() {
      document.getElementById('page-student').classList.add('hidden');
      document.getElementById('page-login').classList.remove('hidden');
    }

    function loginAdmin() {
      const pin = document.getElementById('input-pin').value;
      if(pin === 'SATRIA2026') {
        document.getElementById('page-login').classList.add('hidden');
        document.getElementById('page-admin').classList.remove('hidden');
        document.getElementById('input-pin').value = '';
      } else {
        alert('PIN Salah!');
      }
    }

    function logoutAdmin() {
      document.getElementById('page-admin').classList.add('hidden');
      document.getElementById('page-student').classList.remove('hidden');
    }
  </script>
</body>
</html>
